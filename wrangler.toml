name = "finlegal-backend"
account_id = "78eede6ec04d52fe8b367f14cecb7c08"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Relational SQL Database
[[d1_databases]]
binding = "DB"
database_name = "finlegal-db"
database_id = "64ddf6c2-2062-49cf-9e31-6d6955fdede5"

# Cloudflare Vectorize Native Vector Store
[[vectorize]]
binding = "VECTORIZE"
index_name = "finlegal-vectors"

# Cloudflare R2 Object Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "finlegal-docs"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Optional Cloudflare Queues Producer & Consumer for Async Ingestion Pipeline (Flow §8)
# Enable if Cloudflare Queues is active on your Cloudflare account:
# [[queues.producers]]
# binding = "INGESTION_QUEUE"
# queue = "finlegal-ingestion-queue"
#
# [[queues.consumers]]
# queue = "finlegal-ingestion-queue"
# max_batch_size = 5
# max_batch_timeout = 10
# max_retries = 3
# dead_letter_queue = "finlegal-ingestion-dlq"

# Environment Variables & Non-sensitive Config
[vars]
ENVIRONMENT = "production"
LANGFUSE_HOST = "https://cloud.langfuse.com"
CF_AIG_URL = "https://gateway.ai.cloudflare.com/v1/78eede6ec04d52fe8b367f14cecb7c08/gemini"
DOCUMENT_SERVICE_URL = "https://finlegal-document-service-386583671447.asia-southeast1.run.app"


