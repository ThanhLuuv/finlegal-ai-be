name: Deploy Lexifin Backend Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Typecheck & Deploy Worker to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Secret Availability
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is EMPTY or NOT SET in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is EMPTY or NOT SET in GitHub Repository Secrets!"
            exit 1
          fi
          echo "All required GitHub secrets are present."

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Deploy Worker to Cloudflare Production
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
